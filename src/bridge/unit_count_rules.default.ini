; 特殊单位计数默认模板，UTF-8 编码。
; 安装升级只更新本模板，不覆盖用户的 unit_count_rules.ini。
; 配置优先于内置默认名单；有效文件整表生效，未列出的 ID 使用 normal。

[meta]
version=1

[units]
; normal：不增加特殊排除，仍须通过存活、归属、Spawned 等基础过滤。
; exclude_loaded：仅 InLimbo 且 Transporter 非空时不计，释放后正常统计。
; exclude_all：始终不计。
; ID 大小写不敏感，只允许 1..31 位字母、数字或下划线，不支持通配符。

; 飞蜥炮台：仍内载时不计，弹出后计数。
DRACOD=exclude_loaded

; 原有假载荷：始终不计。
SALA_1=exclude_all
SALA_2=exclude_all
SUNB_1=exclude_all
MAGNET_1=exclude_all
MAGNET_2=exclude_all
CYCL_1=exclude_all
F_KSNAK=exclude_all
